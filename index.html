<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Porquinho Runner</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="game">
        <h1>🐷 Porquinho Runner</h1>

        <div class="score">
            Pontos: <span id="score">0</span>
        </div>

        <div id="gameArea">
            <div id="pig">🐷</div>
            <div id="obstacle">🌵</div>
        </div>

        <button id="jumpButton">PULAR</button>

        <p id="message">Toque em PULAR para começar!</p>

        <button id="restart">JOGAR NOVAMENTE</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
